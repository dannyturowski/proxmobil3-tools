; wt32-r5.0.0 only adds the track selector (src/CMakeLists.txt, src/main.cpp); this file's settings are r4's.
; Nori accessory, WT32-ETH01 build (wt32-r4.0.0): wt32-r3.0.0 (VL53L5CX presence sensor, boot/reset/network
; diagnostics, proven-management mark-valid rule) plus the router role, built the way wt32-r2 was.
;
; Board: original Wireless-Tag WT32-ETH01 (ESP32-D0WD, 4 MB flash, LAN8720A PHY, no PSRAM).  UART0
; (TX0 GPIO1 / RX0 GPIO3) carries only CRC-framed link frames at 460800 baud, as in r1/r3.
;
; r4 network role: Wi-Fi station = upstream (always on while provisioned, DHCP, default route).  Ethernet =
; private point-to-point LAN to the PM3: static 192.168.77.1/24, DHCP server (Ethernet only) leasing
; 192.168.77.2 with router .1 and the upstream DNS.  Real lwIP IPv4 NAPT from Ethernet to Wi-Fi, one DNAT
; port map wifi_ip:2222/tcp -> 192.168.77.2:2222, inbound guard for 192.168.77.0/24 on Wi-Fi.  The serial
; SSH recovery tunnel moved from TCP 2222 to TCP 2223.
;
; Why "arduino, espidf" (from wt32-r2): the precompiled Arduino 2.0.17 SDK (framework-arduinoespressif32
; 3.20017.241212) ships liblwip.a built WITHOUT CONFIG_LWIP_IP_FORWARD / CONFIG_LWIP_IPV4_NAPT.  With both
; frameworks listed, platform espressif32@6.12.0 builds the same Arduino 2.0.17 core as an ESP-IDF
; component against framework-espidf 3.40407.240606 (ESP-IDF v4.4.7, the IDF the Arduino 2.0.17 SDK was
; built from) and compiles lwIP from source with sdkconfig.defaults (generated: Arduino's own sdkconfig +
; sdkconfig.r4-overrides).  The configuration really built lands in sdkconfig.wt32; tools/verify_build.sh
; checks it and the ELF.
;
; Sensor: VL53L5CX on I2C port 0, SDA GPIO33 ("485_EN"), SCL GPIO32 ("CFG"), 400 kHz, 4x4 zones at 5 Hz,
; autonomous mode, 20 ms integration.  ST ULD VL53L5CX_1.3.9 in lib/vl53l5cx_uld (compiled through
; src/CMakeLists.txt in this mode).
;
; Flash: DIO / 40 MHz, 4 MB (as r1/r3).  Partitions: partitions.csv = Arduino default.csv, byte for byte
; (nvs 0x9000, otadata 0xe000, app0 0x10000, app1 0x150000, 0x140000 each, spiffs 0x290000,
; coredump 0x3f0000), so r3 -> r4 is a plain app OTA and r4 -> r3 a plain rollback.
;
; Build defines live in src/CMakeLists.txt (the src dir is an IDF component in this mode).
; Build with accessory/tools/build_firmware.sh (isolated PlatformIO core; never touches ~/.platformio).

[platformio]
default_envs = wt32

[env:wt32]
platform = espressif32@6.12.0
platform_packages =
    framework-arduinoespressif32@3.20017.241212
    framework-espidf@3.40407.240606
framework = arduino, espidf
board = wt32-eth01
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
lib_ldf_mode = off                 ; shared/ and lib/ sources are listed in src/CMakeLists.txt
monitor_speed = 460800
